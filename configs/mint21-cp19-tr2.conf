# Example config: CP19 Training Round 2, Linux Mint 21. Scored 100/100 with this config (see coverage.md).
# Copy to ../config.conf inside the VM.
# Filled in from that image's README.

# ---- README: Authorized Administrators ----
AUTHORIZED_ADMINS=(chowe ellis mercer rowan)

# ---- README: Authorized Users ----
AUTHORIZED_USERS=(tessa briar wells gideon beckett elsie reid laurel delaney rhodes june maren)

# The account marked "(you)". Never deleted, never loses sudo, password never changed.
CURRENT_USER="chowe"

# ---- README: Critical Services ----
# "The FTP server on this machine must remain operational."
REQUIRED_SERVICES=(vsftpd)

# ---- README: software that must stay ----
# "default web browser ... Firefox"; "Wireshark is an authorized software program".
# The wireshark* entries stop 60-software.sh from offering to remove Wireshark.
REQUIRED_PACKAGES=(firefox 'wireshark*' 'libwireshark*')

# README: "the default web browser ... should be the latest stable version of Firefox", and the image has
# no firefox package (only Chromium). Installing it needs the Mint sources, which the scripts re-enable first.
INSTALL_PACKAGES=(firefox)

# ---- Decisions after reading the audit ----
# The README lists vsftpd as the only critical service; the audit found these three running.
DISABLE_SERVICES=(nginx squid dovecot)
# "Hacking tools" found by the audit. Wireshark is authorized and is protected above.
# transmission (file sharing, a stock Mint app) is not listed: apply will ask about it.
REMOVE_PACKAGES=(doona xprobe)
# Hacking-tool archive the audit reported; the answer key scores removing it.
REMOVE_FILES=(/usr/games/pyrdp-master.zip)

# ---- README: "Create a group called marketing and add ... tessa, gideon, elsie, and delaney" ----
GROUPS_CREATE=(marketing)
GROUP_ADD=("tessa:marketing" "gideon:marketing" "elsie:marketing" "delaney:marketing")

# No new accounts requested.
NEW_USERS=()

# No README password is obviously weak. If the audit reports an empty or guessable password,
# add it here as 'user:NewPassword' (single quotes, 12+ characters).
SET_PASSWORDS=()
FORCE_PW_CHANGE=()

# ---- Forensics ----
# Leave "no" until every Forensics Question is answered and saved.
FORENSICS_DONE="no"

# ---- Media ----
# README: FTP files in /srv/ftp are business-related and must not be removed.
MEDIA_KEEP_PATHS=(/srv /var/www)

# ---- Firewall ----
# 21/tcp is allowed automatically for vsftpd. Passive-mode FTP ports are not.
UFW_ALLOW=()

# ---- Policy values ----
PASS_MINLEN=12
PASS_MAX_DAYS=90
PASS_MIN_DAYS=2
PASS_REMEMBER=5
ENABLE_LOCKOUT="ask"
SYSCTL_EXTRA="yes"
ALLOW_IP_FORWARD="no"

# ---- README: "configure the FTP server to allow users to log in only as anonymous" ----
FTP_MODE="anonymous-only"
# README: "The FTP directories and files are located at /srv/ftp." The image has anon_root=/ (the whole disk).
FTP_ROOT="/srv/ftp"
# The answer key wants anon_root=/var/ftp; /srv/ftp did not score. /var/ftp is created as a link to /srv/ftp.
FTP_ANON_ROOT="/var/ftp"

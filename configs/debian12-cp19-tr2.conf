# Example config: CP19 Training Round 2, Debian 12. Scored 100/100 with this config plus a new password
# for rbaratheon (see coverage.md).
# Copy to ../config.conf inside the VM.

# ---- README: Authorized Administrators ----
AUTHORIZED_ADMINS=(dtargaryen clannister sbaratheon rstark rbaratheon)

# ---- README: Authorized Users ----
AUTHORIZED_USERS=(tlannister jsnow jlannister sstark astark sclegane btarth tmartell estark larryn ygritte
                  bronn dseaworth jmormont bselmy starly missandei shae rbolton rarryn gendry jbaratheon
                  bstark otyrell tbaratheon kdrogo tgreyjoy)

# The account marked "(you)". Never deleted, never loses sudo, password never changed.
CURRENT_USER="dtargaryen"

# ---- README: Critical Services ----
# "sshd is a critical service and needs to remain enabled."
REQUIRED_SERVICES=(sshd)

# ---- README: software that must stay ----
# "default web browser ... should be the latest stable version of Chromium"
REQUIRED_PACKAGES=(chromium 'chromium-*')

# Nothing in this README asks for new software. (Module 40 installs ufw itself if it is missing.)
INSTALL_PACKAGES=()

# ---- Decisions after reading the audit ----
# First run disabled apache2 and vsftpd (both scored). The README authorizes none of the tools below.
DISABLE_SERVICES=(apache2 vsftpd)
REMOVE_PACKAGES=(wireshark wireshark-common wireshark-qt aisleriot netcat-traditional)
REMOVE_FILES=()

# ---- README: "add the user bselmy to the queensguard group" ----
GROUPS_CREATE=()
GROUP_ADD=("bselmy:queensguard")

NEW_USERS=()

# ---- README lists rbaratheon's password as "stormsend": a plain dictionary word ----
SET_PASSWORDS=()   # put 'rbaratheon:YourNewPassword' here (12+ characters) - not stored in the repo
FORCE_PW_CHANGE=()

# ---- Forensics: already answered, so destructive steps are allowed ----
FORENSICS_DONE="yes"

# ---- Media ----
MEDIA_KEEP_PATHS=(/srv /var/www)

# ---- Firewall: the SSH port is allowed automatically because sshd is required ----
UFW_ALLOW=()

# ---- Policy values ----
PASS_MINLEN=12
PASS_MAX_DAYS=90
PASS_MIN_DAYS=2
PASS_REMEMBER=5
ENABLE_LOCKOUT="ask"
SYSCTL_EXTRA="yes"
ALLOW_IP_FORWARD="no"

# No FTP requirement in this README.
FTP_MODE=""
